# À chaque tag v* : build, tests, publication npm par Trusted Publishing
# (provenance OIDC, éditeur GitHub Actions déclaré sur npmjs.com, environnement
# "npm"), release GitHub avec des notes générées par git-cliff et le tarball.
#
# Workflow volontairement autonome : les registres (PyPI constaté le 2026-09-24,
# npm par précaution) comparent le claim job_workflow_ref au fichier déclaré,
# ce qu'un workflow réutilisable ne satisfait pas.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  publish:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # git-cliff lit l'historique jusqu'au tag précédent
      # Pas de registry-url : setup-node ecrirait un .npmrc avec un jeton
      # fictif (NODE_AUTH_TOKEN=XXXXX) que npm utiliserait a la place de
      # l'echange OIDC du Trusted Publishing -> E404 sur le PUT (2026-09-24).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # Trusted Publishing demande npm >= 11.5
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test --if-present
      - run: npm pack
      - run: npm publish --provenance --access public
      - name: Notes de release (git-cliff, cliff.toml)
        run: npx --yes git-cliff@2.14.2 --latest --strip all -o RELEASE_NOTES.md
      - name: Release GitHub avec les notes et le tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md
          gh release upload "${GITHUB_REF_NAME}" *.tgz --repo "${GITHUB_REPOSITORY}" --clobber
  # Registre MCP officiel : publie server.json (meme version que le paquet) par
  # OIDC GitHub, sans connexion manuelle. Aussi lancable seul (workflow_dispatch)
  # pour remettre le registre a jour sans refaire de release.
  registry:
    needs: [publish]
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
      # sha256 de mcp-publisher_linux_amd64.tar.gz v1.8.1, recoupe avec le bundle sigstore publie
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@v7
      - name: Installer mcp-publisher (version et empreinte figees)
        run: |
          curl -fsSLo mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Connexion au registre (OIDC GitHub)
        run: ./mcp-publisher login github-oidc
      - name: Publier server.json
        run: ./mcp-publisher publish
